apiVersion: operator.victoriametrics.com/v1
kind: VMEstimator
metadata:
  name: example
spec:
  streamsConfigMap:
    name: vmestimator-streams
    key: streams.yaml
  storage:
    replicaCount: 3
    podDisruptionBudget:
      maxUnavailable: 1
    extraArgs:
      deduplication.interval: 3m
    # load-balances remote write requests among storage nodes,
    # use http://vmestimator-insert-example:8490/cardinality/api/v1/write as remote write url
    serviceSpec:
      metadata:
        name: vmestimator-insert-example
      spec: {}
  select:
    replicaCount: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmestimator-streams
data:
  streams.yaml: |
    streams:
      - interval: '15m'
        calculate_churn: true
      - interval: '15m'
        group_by: ['job']
      - interval: '15m'
        group_by: ['__name__']
