name: Build and Test
# Runs on every push to master and on pull requests targeting master or release-* branches.
#
# Pull requests:
# - The workflow is not triggered when only docs/**, *.md, config/examples/**, config/samples/**
#   or .github/** (except this workflow and .github/actions/**) change.
# - Draft PRs skip lint and unit tests.
#
# Pushes to master always run Build and Test.
#
# e2e tests run in the E2E workflow, see e2e.yaml.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - release-*
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!config/examples/**'
      - '!config/samples/**'
      - '!.github/**'
      - '.github/workflows/main.yaml'
      - '.github/actions/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build environment
        id: setup
        uses: ./.github/actions/setup-build-env

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Lint, Test and Build
        if: github.event.pull_request.draft == false
        run: |
          make lint
          make manifests
          make api-gen
          make docs
          # check for uncommited changes to crds, docs or API
          git diff --exit-code
          make test

      - name: Check rbac markers are not inert
        if: github.event.pull_request.draft == false
        run: ./hack/check-rbac-markers.sh

      - name: Save Go cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/save-go-cache
