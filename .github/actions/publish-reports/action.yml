name: Publish Reports
description: Publish JUnit test report

runs:
  using: composite
  steps:
    - name: Publish Test Report
      if: success() || failure()
      uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6.5.0
      with:
        report_paths: 'report.xml'
