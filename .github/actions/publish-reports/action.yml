name: Publish Reports
description: Publish JUnit test report

runs:
  using: composite
  steps:
    - name: Publish Test Report
      if: success() || failure()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d  # v6.6.1
      with:
        report_paths: 'report.xml'
