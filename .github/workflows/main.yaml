name: Build and Test
# Runs on every push to master and on pull requests targeting master or release-* branches.
#
# Pull requests:
# - The workflow is not triggered when only docs/**, *.md, config/examples/**, config/samples/**
#   or .github/** (except this workflow and .github/actions/**) change.
# - Draft PRs skip lint, unit tests and e2e.
# - e2e is skipped when only the paths above, the root Makefile, go.mod/go.sum or codespell/** change.
#
# Pushes to master:
# - Build and Test always runs.
# - e2e runs unless only the paths above or codespell/** change; Makefile and go.mod/go.sum
#   changes skip e2e on PRs but are tested here.
#
# See the "Check changed files" step for the e2e filters.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - release-*
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!config/examples/**'
      - '!config/samples/**'
      - '!.github/**'
      - '.github/workflows/main.yaml'
      - '.github/actions/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      checks: write
    outputs:
      run_e2e: ${{ steps.changes.outputs.src == 'true' || steps.changes.outputs.ci == 'true' || (github.event_name == 'push' && steps.changes.outputs.deps == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build environment
        id: setup
        uses: ./.github/actions/setup-build-env

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Lint, Test and Build
        if: github.event.pull_request.draft == false
        run: |
          make lint
          make manifests
          make api-gen
          make docs
          # check for uncommited changes to crds, docs or API
          git diff --exit-code
          make test

      - name: Check rbac markers are not inert
        if: github.event.pull_request.draft == false
        run: ./hack/check-rbac-markers.sh

      - name: Save Go cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/save-go-cache

      - name: Check changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          # a file matches a filter when it matches one of its rules and none of its '!' rules
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!Makefile'
              - '!docs/**'
              - '!**/*.md'
              - '!config/examples/**'
              - '!config/samples/**'
              - '!**/go.mod'
              - '!**/go.sum'
              - '!.github/**'
              - '!codespell/**'
            # kept out of src, since an excluded path cannot be re-included there
            ci:
              - '.github/workflows/main.yaml'
              - '.github/actions/**'
            # dependency and tool version bumps: e2e on master pushes only
            deps:
              - 'Makefile'
              - '**/go.mod'
              - '**/go.sum'

  e2e:
    name: E2E / ${{ matrix.name }}
    needs: build
    if: github.event.pull_request.draft == false && needs.build.outputs.run_e2e == 'true'
    runs-on: vm-runner
    permissions:
      actions: read
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            e2e_target: ./test/e2e/
          - name: upgrade
            e2e_target: ./test/e2e/upgrade/...
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup build environment
        id: setup
        uses: ./.github/actions/setup-build-env
      - name: E2E Tests
        env:
          DOCKER_BUILD_ARGS: --cache-from=type=gha --cache-to=type=gha,mode=max
          LICENSE_KEY: ${{ secrets.ENTERPRISE_COMPONENTS_LICENSE_KEY }}
          E2E_TARGET: ${{ matrix.e2e_target }}
        run: |
          TAG=${GITHUB_SHA:0:7} BASE_REF=origin/${{ github.base_ref || 'master' }} make test-e2e
      - name: Save Go cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/save-go-cache
      - name: Publish reports
        uses: ./.github/actions/publish-reports
