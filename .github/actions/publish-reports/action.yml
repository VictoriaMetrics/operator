name: Publish Reports
description: Publish JUnit test report

runs:
  using: composite
  steps:
    - name: Publish Test Report
      if: success() || failure()
      uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3  # v6.6.0
      with:
        report_paths: 'report.xml'
